services:
  # ─── Web API サービス ─────────────────────────────────────────
  - type: web
    name: high-performance-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: high-performance-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: high-performance-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
    healthCheckPath: /health
    autoDeploy: true

  # ─── Celery Worker ────────────────────────────────────────────
  - type: worker
    name: high-performance-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: "celery -A app.worker worker --loglevel=info --concurrency=2"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: high-performance-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: high-performance-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: high-performance-app
          type: web
          envVarKey: SECRET_KEY

databases:
  # ─── PostgreSQL ───────────────────────────────────────────────
  - name: high-performance-db
    plan: free
    databaseName: highperf_db
    user: highperf_user

  # ─── Redis ───────────────────────────────────────────────────
  - name: high-performance-redis
    type: redis
    plan: free
    ipAllowList: []
