name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check app/ --ignore E501

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test_temp.db
          SECRET_KEY: test-secret-key-for-ci
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  migration-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check Alembic migrations
        env:
          DATABASE_URL: sqlite:///./migration_check.db
        run: |
          alembic upgrade head
          alembic check

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (multi-stage)
        run: docker build --target production -t high-performance-app:latest .
      - name: Verify image
        run: docker run --rm high-performance-app:latest python -c "print('Docker build OK')"
      - name: Check image size
        run: docker images high-performance-app:latest --format "Size: {{.Size}}"
